<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ciel des proches</title>
<meta name="description" content="Météo astrale de la famille : thèmes natals et ciel du jour, calculés localement.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,600&family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b1622; --bg-panel:#101f30; --bg-card:#132539; --hairline:#22384f;
    --text-hi:#f3f6f9; --text-lo:#8fa4b8;
    --amber:#f4a261; --coral:#e76f51; --teal:#2a9d8f; --azure:#457b9d; --live:#7ee4b8; --gold:#ffd166;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse 900px 500px at 15% -10%, rgba(69,123,157,0.18), transparent 60%),
      radial-gradient(ellipse 700px 500px at 90% 0%, rgba(255,209,102,0.08), transparent 55%),
      var(--bg);
    color:var(--text-hi); font-family:'Space Grotesk',sans-serif; min-height:100vh; padding:28px 16px 60px;
  }
  .wrap{max-width:1080px;margin:0 auto;}
  .mono{font-family:'IBM Plex Mono',monospace;}

  header{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:16px;
    border-bottom:1px solid var(--hairline);padding-bottom:22px;margin-bottom:26px;}
  .eyebrow{font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--live);display:flex;align-items:center;gap:8px;margin-bottom:8px;}
  .pulse{width:7px;height:7px;border-radius:50%;background:var(--live);animation:pulse 2.2s infinite;}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(126,228,184,.55);}70%{box-shadow:0 0 0 9px rgba(126,228,184,0);}100%{box-shadow:0 0 0 0 rgba(126,228,184,0);}}
  h1{font-family:'Fraunces',serif;font-weight:600;font-style:italic;font-size:clamp(28px,4vw,42px);margin:0;letter-spacing:-.01em;}
  .subtitle{color:var(--text-lo);font-size:14px;margin-top:6px;max-width:52ch;}
  .day-toggle{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;}
  .day-toggle-btn{font-family:'IBM Plex Mono',monospace;font-size:12.5px;background:var(--bg-card);color:var(--text-lo);
    border:1px solid var(--hairline);border-radius:999px;padding:7px 16px;cursor:pointer;transition:border-color .15s,color .15s,background .15s;}
  .day-toggle-btn:hover{border-color:var(--live);}
  .day-toggle-btn.active{background:rgba(126,228,184,0.12);border-color:var(--live);color:var(--text-hi);font-weight:500;}
  .meta{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--text-lo);text-align:right;line-height:1.7;}
  .meta-buttons{display:flex;gap:8px;margin-top:6px;justify-content:flex-end;flex-wrap:wrap;}
  .btn{font-family:'IBM Plex Mono',monospace;font-size:12px;background:var(--bg-card);color:var(--text-hi);
    border:1px solid var(--hairline);border-radius:6px;padding:6px 12px;cursor:pointer;transition:border-color .15s,transform .1s;}
  .btn:hover{border-color:var(--azure);}
  .btn:active{transform:scale(.97);}
  .btn:focus-visible,.day-toggle-btn:focus-visible{outline:2px solid var(--live);outline-offset:2px;}
  .btn-live{border-color:rgba(126,228,184,.5);color:var(--live);}

  .bulletin{background:var(--bg-panel);border:1px solid var(--hairline);border-radius:16px;padding:20px 22px 22px;margin-top:22px;}
  .bulletin-header{font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.1em;text-transform:uppercase;
    color:var(--live);margin-bottom:12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .bulletin-header .right{margin-left:auto;text-transform:none;letter-spacing:0;color:var(--text-lo);font-size:11.5px;}
  .bulletin-summary{font-size:14.5px;line-height:1.65;max-width:70ch;}
  .sky-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-top:14px;}
  .sky-chip{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--text-lo);background:rgba(255,255,255,.02);
    border:1px solid var(--hairline);border-radius:10px;padding:10px 12px;line-height:1.5;}
  .sky-chip b{display:block;color:var(--text-hi);font-size:14px;font-weight:600;margin-top:2px;}

  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-top:22px;align-items:start;}
  .card{background:var(--bg-card);border:1px solid var(--hairline);border-radius:14px;padding:16px 16px 12px;position:relative;overflow:hidden;cursor:pointer;transition:border-color .15s;}
  .card:hover{border-color:var(--azure);}
  .card.selected{border-color:var(--live);}
  .card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent);}
  .card-top{display:flex;align-items:center;gap:12px;margin-bottom:10px;}
  .avatar{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-size:20px;background:rgba(255,255,255,.04);box-shadow:0 0 0 1px var(--hairline);flex:none;}
  .card-names{font-size:14px;font-weight:500;}
  .card-city{font-size:11.5px;color:var(--text-lo);font-family:'IBM Plex Mono',monospace;}
  .card-del{position:absolute;top:10px;right:10px;background:none;border:none;color:var(--text-lo);cursor:pointer;font-size:13px;opacity:.5;padding:4px;}
  .card-del:hover{opacity:1;color:var(--coral);}
  .rank{position:absolute;top:14px;right:34px;font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--gold);}
  .card-score{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:30px;line-height:1;margin:4px 0 6px;}
  .card-score span{font-size:14px;color:var(--text-lo);font-weight:400;}
  .card-signs{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--text-lo);margin-bottom:10px;}
  .card-signs b{color:var(--text-hi);font-weight:500;}
  .horo{display:grid;grid-template-columns:max-content 1fr;gap:3px 12px;font-size:13px;align-items:baseline;
    border-top:1px solid var(--hairline);padding-top:9px;}
  .horo-k{color:var(--text-lo);font-family:'IBM Plex Mono',monospace;font-size:12px;}
  .stars{letter-spacing:1px;color:var(--gold);font-size:12.5px;white-space:nowrap;}
  .stars i{font-style:normal;color:var(--text-lo);opacity:.45;}
  .card-text{font-size:12.5px;line-height:1.5;color:var(--text-hi);margin-top:10px;padding-top:9px;border-top:1px dashed var(--hairline);}
  .card-text p{margin:0 0 6px;}
  .card-text .muted{color:var(--text-lo);}
  .card-foot{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--text-lo);text-align:center;margin-top:6px;}

  .hint-box{display:flex;align-items:center;gap:10px;background:var(--bg-panel);border:1px solid var(--hairline);border-radius:12px;
    padding:12px 16px;margin-top:14px;font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:var(--text-lo);}

  /* Thème natal */
  .theme-grid{display:grid;grid-template-columns:minmax(260px,340px) 1fr;gap:22px;align-items:start;}
  @media (max-width:760px){.theme-grid{grid-template-columns:1fr;}}
  .wheel{display:block;width:100%;max-width:340px;margin:0 auto;height:auto;}
  .w-ring{fill:none;stroke:var(--hairline);stroke-width:1;}
  .w-sector{stroke:var(--hairline);stroke-width:.8;}
  .w-sign{font:13px 'Space Grotesk',sans-serif;fill:var(--text-lo);text-anchor:middle;dominant-baseline:central;}
  .w-house{font:8px 'IBM Plex Mono',monospace;fill:rgba(143,164,184,.6);text-anchor:middle;dominant-baseline:central;}
  .w-axis{stroke:rgba(126,228,184,.55);stroke-width:1;}
  .w-hl{stroke:rgba(143,164,184,.18);stroke-dasharray:2 3;}
  .w-pl{font:bold 14px 'Space Grotesk',sans-serif;text-anchor:middle;dominant-baseline:central;}
  .w-tick{stroke-width:1.2;}
  .w-lbl{font:bold 8px 'IBM Plex Mono',monospace;fill:var(--live);}
  .w-asp{stroke-width:.8;opacity:.55;}
  table.pos{width:100%;border-collapse:collapse;font-size:13px;}
  table.pos td{padding:5px 6px;border-bottom:1px solid var(--hairline);}
  table.pos td.k{color:var(--text-lo);white-space:nowrap;}
  table.pos td.deg{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--text-lo);text-align:right;white-space:nowrap;}
  .interp{margin-top:16px;font-size:13.5px;line-height:1.6;}
  .interp p{margin:0 0 8px;}
  .interp b{font-weight:600;}
  .sub{font-family:'IBM Plex Mono',monospace;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--live);margin:16px 0 6px;}

  /* Formulaire */
  .form{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;}
  .field label{display:block;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-lo);margin-bottom:5px;}
  .field input[type=text],.field input[type=date],.field input[type=time]{width:100%;background:var(--bg-card);color:var(--text-hi);
    border:1px solid var(--hairline);border-radius:8px;padding:9px 10px;font:14px 'Space Grotesk',sans-serif;color-scheme:dark;}
  .field input:focus{outline:none;border-color:var(--live);}
  .check{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-lo);margin-top:6px;font-family:'IBM Plex Mono',monospace;}
  .place-field{grid-column:span 2;position:relative;}
  @media (max-width:560px){.place-field{grid-column:auto;}}
  .suggest{position:absolute;left:0;right:0;top:100%;z-index:20;background:var(--bg-card);border:1px solid var(--hairline);
    border-radius:8px;margin-top:4px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.45);}
  .suggest button{display:block;width:100%;text-align:left;background:none;border:none;border-bottom:1px solid var(--hairline);
    color:var(--text-hi);padding:9px 12px;cursor:pointer;font:13px 'Space Grotesk',sans-serif;}
  .suggest button:last-child{border-bottom:none;}
  .suggest button:hover{background:rgba(126,228,184,.08);}
  .suggest small{color:var(--text-lo);font-family:'IBM Plex Mono',monospace;font-size:11px;}
  .form-actions{display:flex;gap:10px;align-items:center;margin-top:14px;flex-wrap:wrap;}
  .form-msg{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--text-lo);}
  .form-msg.err{color:var(--coral);}
  .hidden{display:none !important;}

  footer{margin-top:30px;font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--text-lo);text-align:center;line-height:1.7;}
  footer a{color:var(--text-lo);}
  .contact{display:inline-block;margin-top:12px;color:var(--live);text-decoration:none;border:1px solid var(--hairline);border-radius:8px;padding:5px 12px;}
  @media (max-width:640px){.meta{text-align:left;}.meta-buttons{justify-content:flex-start;}header{flex-direction:column;align-items:flex-start;}}

  /* Fonctionnalités du site */
  .features-panel{margin-top:22px;}
  .features-panel details{background:var(--bg-panel);border:1px solid var(--hairline);border-radius:16px;padding:4px 22px;}
  .features-panel summary{cursor:pointer;padding:15px 0;font-size:15px;font-weight:500;list-style:none;display:flex;align-items:center;gap:9px;user-select:none;}
  .features-panel summary::-webkit-details-marker{display:none;}
  .features-panel summary::before{content:"▸";color:var(--live);font-size:13px;transition:transform .15s;display:inline-block;}
  .features-panel details[open] summary::before{transform:rotate(90deg);}
  .features-body{padding:2px 0 20px;}
  .features-panel h3{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--live);margin:18px 0 8px;}
  .features-panel h3:first-child{margin-top:4px;}
  .features-panel ul{margin:0;padding-left:20px;font-size:13.5px;line-height:1.7;}
  .features-panel li{margin-bottom:4px;}
  .features-panel .f-dim{color:var(--text-lo);}
  .pal-row{display:grid;grid-template-columns:34px minmax(90px,170px) 1fr 44px;align-items:center;gap:10px;
    padding:7px 6px;border-radius:9px;cursor:pointer;}
  .pal-row:hover{background:rgba(126,228,184,.06);}
  .pal-row.selected{background:rgba(126,228,184,.10);}
  .pal-rank{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--text-lo);text-align:center;}
  .pal-name{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .pal-name small{display:block;font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:400;color:var(--text-lo);}
  .pal-bar{height:8px;background:rgba(255,255,255,.05);border-radius:99px;overflow:hidden;}
  .pal-bar i{display:block;height:100%;border-radius:99px;}
  .pal-score{font-family:'IBM Plex Mono',monospace;font-size:15px;font-weight:600;text-align:right;}
  @media (max-width:480px){.pal-row{grid-template-columns:28px 1fr 60px 34px;gap:8px;}}
  .js-tooltip{position:fixed;z-index:9999;max-width:270px;background:var(--bg-card);border:1px solid var(--hairline);color:var(--text-hi);
    font:12px/1.5 'Space Grotesk',sans-serif;padding:8px 11px;border-radius:9px;box-shadow:0 8px 24px rgba(0,0,0,.45);pointer-events:none;}
  .js-tooltip b{font-weight:600;}
  .js-tooltip .tip-lo{color:var(--text-lo);font-family:'IBM Plex Mono',monospace;font-size:11px;}
  [data-tip]{cursor:help;}
  .wheel [data-tip]:hover{filter:brightness(1.35);}
  .w-hit{fill:transparent;stroke:transparent;}
  .w-hitline{stroke:transparent;stroke-width:9;}
  table.pos tr[data-tip]:hover td{background:rgba(126,228,184,.05);}

  .switches-row{display:flex;gap:8px;justify-content:flex-end;}
  .lang-switch{display:inline-flex;background:var(--bg-card);border:1px solid var(--hairline);border-radius:999px;padding:3px;gap:2px;}
  .lang-switch button{font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:600;background:transparent;color:var(--text-lo);
    border:none;border-radius:999px;padding:6px 15px;cursor:pointer;transition:background .15s,color .15s;}
  .lang-switch button:hover{color:var(--text-hi);}
  .lang-switch button.active{background:var(--live);color:#0b1622;}
  @media (max-width:640px){.switches-row{justify-content:flex-start;}}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div>
      <div class="eyebrow"><span class="pulse"></span> <span data-i18n="eyebrow"></span></div>
      <h1 data-i18n="title"></h1>
      <div class="subtitle" id="subtitle"></div>
      <div class="day-toggle" id="day-toggle">
        <button class="day-toggle-btn active" data-p="0"></button>
        <button class="day-toggle-btn" data-p="1"></button>
        <button class="day-toggle-btn" data-p="2"></button>
        <button class="day-toggle-btn" data-p="7"></button>
      </div>
    </div>
    <div class="meta">
      <div class="switches-row">
        <div class="lang-switch" id="lang-switch">
          <button data-lang="fr">FR</button>
          <button data-lang="en">EN</button>
        </div>
      </div>
      <div id="updated-at">—</div>
      <div class="meta-buttons">
        <button class="btn btn-live" id="add-btn" data-i18n="add"></button>
        <button class="btn" id="share-btn" data-i18n="share"></button>
      </div>
    </div>
  </header>

  <!-- Formulaire d'ajout -->
  <div class="bulletin hidden" id="form-block" style="margin-top:0;margin-bottom:22px;">
    <div class="bulletin-header" data-i18n="formHead"></div>
    <div class="form">
      <div class="field"><label for="f-name" data-i18n="fName"></label><input type="text" id="f-name" maxlength="30" placeholder="Marine"></div>
      <div class="field"><label for="f-date" data-i18n="fDate"></label><input type="text" id="f-date" inputmode="numeric" autocomplete="off" maxlength="10" data-i18n-ph="fDatePh"></div>
      <div class="field"><label for="f-time" data-i18n="fTime"></label><input type="text" id="f-time" inputmode="numeric" autocomplete="off" maxlength="5" data-i18n-ph="fTimePh">
        <label class="check"><input type="checkbox" id="f-notime"> <span data-i18n="fNoTime"></span></label></div>
      <div class="field place-field"><label for="f-place" data-i18n="fPlace"></label>
        <input type="text" id="f-place" data-i18n-ph="fPlacePh" autocomplete="off">
        <div class="suggest hidden" id="suggest"></div></div>
    </div>
    <div class="form-actions">
      <button class="btn btn-live" id="f-save" data-i18n="fSave"></button>
      <button class="btn" id="f-cancel" data-i18n="fCancel"></button>
      <span class="form-msg" id="f-msg"></span>
    </div>
  </div>

  <!-- Bulletin cosmique -->
  <div class="bulletin" id="sky" style="margin-top:0;"></div>

  <div class="cards" id="cards"></div>

  <!-- Palmarès -->
  <div class="bulletin hidden" id="palmares"></div>

  <div class="hint-box"><span>💡</span><span data-i18n="hint"></span></div>

  <!-- Thème natal détaillé -->
  <div class="bulletin hidden" id="theme"></div>

  <!-- Fonctionnalités du site -->
  <div class="features-panel">
    <details>
      <summary data-i18n="featTitle"></summary>
      <div class="features-body" data-i18n-html="featBody"></div>
    </details>
  </div>

  <footer>
    <span data-i18n-html="footer"></span>
    <div style="margin-top:14px;" data-i18n="signature"></div>
    <a class="contact" href="https://forms.gle/EMZtxMBJCUE6HJXp8" target="_blank" rel="noopener" data-i18n="contact"></a>
  </footer>
</div>

<script>
// ==CORE==
const RAD = Math.PI / 180, DEG = 180 / Math.PI;
const norm = x => ((x % 360) + 360) % 360;
const sind = x => Math.sin(x * RAD), cosd = x => Math.cos(x * RAD);
const angDiff = (a, b) => { const d = Math.abs(norm(a - b)); return d > 180 ? 360 - d : d; };
const signedDiff = (a, b) => ((b - a + 540) % 360) - 180;

// jours depuis 2000 jan 0.0 UT
const dayNumber = ms => ms / 86400000 + 2440587.5 - 2451543.5;

const ELEMENTS = {
  mercury: d => [48.3313 + 3.24587e-5*d, 7.0047 + 5.00e-8*d, 29.1241 + 1.01444e-5*d, 0.387098, 0.205635 + 5.59e-10*d, 168.6562 + 4.0923344368*d],
  venus:   d => [76.6799 + 2.46590e-5*d, 3.3946 + 2.75e-8*d, 54.8910 + 1.38374e-5*d, 0.723330, 0.006773 - 1.302e-9*d, 48.0052 + 1.6021302244*d],
  mars:    d => [49.5574 + 2.11081e-5*d, 1.8497 - 1.78e-8*d, 286.5016 + 2.92961e-5*d, 1.523688, 0.093405 + 2.516e-9*d, 18.6021 + 0.5240207766*d],
  jupiter: d => [100.4542 + 2.76854e-5*d, 1.3030 - 1.557e-7*d, 273.8777 + 1.64505e-5*d, 5.20256, 0.048498 + 4.469e-9*d, 19.8950 + 0.0830853001*d],
  saturn:  d => [113.6634 + 2.38980e-5*d, 2.4886 - 1.081e-7*d, 339.3939 + 2.97661e-5*d, 9.55475, 0.055546 - 9.499e-9*d, 316.9670 + 0.0334442282*d],
  uranus:  d => [74.0005 + 1.3978e-5*d, 0.7733 + 1.9e-8*d, 96.6612 + 3.0565e-5*d, 19.18171 - 1.55e-8*d, 0.047318 + 7.45e-9*d, 142.5905 + 0.011725806*d],
  neptune: d => [131.7806 + 3.0173e-5*d, 1.7700 - 2.55e-7*d, 272.8461 - 6.027e-6*d, 30.05826 + 3.313e-8*d, 0.008606 + 2.15e-9*d, 260.2471 + 0.005995147*d]
};

function kepler(M, e) {
  M = norm(M);
  let E = M + e * DEG * sind(M) * (1 + e * cosd(M));
  for (let k = 0; k < 15; k++) {
    const dE = (E - e * DEG * sind(E) - M) / (1 - e * cosd(E));
    E -= dE;
    if (Math.abs(dE) < 1e-7) break;
  }
  return E;
}

function orbit([N, i, w, a, e, M]) {
  const E = kepler(M, e);
  const xv = a * (cosd(E) - e), yv = a * Math.sqrt(1 - e * e) * sind(E);
  const v = Math.atan2(yv, xv) * DEG, r = Math.hypot(xv, yv), vw = v + w;
  return {
    x: r * (cosd(N) * cosd(vw) - sind(N) * sind(vw) * cosd(i)),
    y: r * (sind(N) * cosd(vw) + cosd(N) * sind(vw) * cosd(i)),
    z: r * sind(vw) * sind(i), r
  };
}

// Longitudes écliptiques géocentriques (équinoxe de la date) + données sidérales
function skyAt(ms) {
  const d = dayNumber(ms);
  const ecl = 23.4393 - 3.563e-7 * d;
  const ws = 282.9404 + 4.70935e-5 * d, es = 0.016709 - 1.151e-9 * d, Ms = norm(356.0470 + 0.9856002585 * d);
  const Es = kepler(Ms, es);
  const xv = cosd(Es) - es, yv = Math.sqrt(1 - es * es) * sind(Es);
  const lonSun = norm(Math.atan2(yv, xv) * DEG + ws), rs = Math.hypot(xv, yv);
  const xs = rs * cosd(lonSun), ys = rs * sind(lonSun);
  const lon = { sun: lonSun };

  // Lune
  const Nm = 125.1228 - 0.0529538083 * d, wm = 318.0634 + 0.1643573223 * d, Mm = norm(115.3654 + 13.0649929509 * d);
  const mo = orbit([Nm, 5.1454, wm, 60.2666, 0.0549, Mm]);
  const Ls = Ms + ws, Lm = Mm + wm + Nm, D = Lm - Ls, F = Lm - Nm;
  lon.moon = norm(Math.atan2(mo.y, mo.x) * DEG
    - 1.274 * sind(Mm - 2*D) + 0.658 * sind(2*D) - 0.186 * sind(Ms)
    - 0.059 * sind(2*Mm - 2*D) - 0.057 * sind(Mm - 2*D + Ms) + 0.053 * sind(Mm + 2*D)
    + 0.046 * sind(2*D - Ms) + 0.041 * sind(Mm - Ms) - 0.035 * sind(D)
    - 0.031 * sind(Mm + Ms) - 0.015 * sind(2*F - 2*D) + 0.011 * sind(Mm - 4*D));

  // Planètes
  const Mj = norm(19.8950 + 0.0830853001 * d), Mst = norm(316.9670 + 0.0334442282 * d), Mu = norm(142.5905 + 0.011725806 * d);
  for (const p of Object.keys(ELEMENTS)) {
    const h = orbit(ELEMENTS[p](d));
    let hl = Math.atan2(h.y, h.x) * DEG;
    const hb = Math.atan2(h.z, Math.hypot(h.x, h.y)) * DEG;
    let dl = 0;
    if (p === 'jupiter') dl = -0.332*sind(2*Mj-5*Mst-67.6) - 0.056*sind(2*Mj-2*Mst+21) + 0.042*sind(3*Mj-5*Mst+21)
      - 0.036*sind(Mj-2*Mst) + 0.022*cosd(Mj-Mst) + 0.023*sind(2*Mj-3*Mst+52) - 0.016*sind(Mj-5*Mst-69);
    if (p === 'saturn') dl = 0.812*sind(2*Mj-5*Mst-67.6) - 0.229*cosd(2*Mj-4*Mst-2) + 0.119*sind(Mj-2*Mst-3)
      + 0.046*sind(2*Mj-6*Mst-69) + 0.014*sind(Mj-3*Mst+32);
    if (p === 'uranus') dl = 0.040*sind(Mst-2*Mu+6) + 0.035*sind(Mst-3*Mu+33) - 0.015*sind(Mj-Mu+20);
    hl += dl;
    const xh = h.r * cosd(hb) * cosd(hl), yh = h.r * cosd(hb) * sind(hl);
    lon[p] = norm(Math.atan2(yh + ys, xh + xs) * DEG);
  }
  const ut = ((ms % 86400000) + 86400000) % 86400000 / 3600000;
  const gmst = norm(Ls + 180 + ut * 15); // degrés
  return { lon, ecl, gmst };
}

// Ascendant et Milieu du Ciel
function angles(ms, lat, lonEast) {
  const { ecl, gmst } = skyAt(ms);
  const ramc = norm(gmst + lonEast);
  const mc = norm(Math.atan2(sind(ramc), cosd(ramc) * cosd(ecl)) * DEG);
  const asc = norm(Math.atan2(cosd(ramc), -(sind(ramc) * cosd(ecl) + Math.tan(lat * RAD) * sind(ecl))) * DEG);
  return { asc, mc };
}

// Heure locale (fuseau IANA, y compris historique) → timestamp UTC
function localToUTC(dateStr, timeStr, tz) {
  const [y, m, d] = dateStr.split('-').map(Number);
  const [hh, mm] = timeStr.split(':').map(Number);
  const wall = Date.UTC(y, m - 1, d, hh, mm);
  const fmt = new Intl.DateTimeFormat('en-US', { timeZone: tz, hourCycle: 'h23',
    year: 'numeric', month: 'numeric', day: 'numeric', hour: 'numeric', minute: 'numeric' });
  const offsetAt = t => {
    const p = Object.fromEntries(fmt.formatToParts(new Date(t)).map(x => [x.type, x.value]));
    return Date.UTC(+p.year, +p.month - 1, +p.day, +p.hour % 24, +p.minute) - Math.floor(t / 60000) * 60000;
  };
  let t = wall - offsetAt(wall);
  t = wall - offsetAt(t);
  return t;
}

// ---------- Données ----------
const SIGN_DATA = [['♈','feu'],['♉','terre'],['♊','air'],['♋','eau'],['♌','feu'],['♍','terre'],
  ['♎','air'],['♏','eau'],['♐','feu'],['♑','terre'],['♒','air'],['♓','eau']];
const PLANET_DATA = [
  { k:'sun', g:'☉', c:'#ffd166' }, { k:'moon', g:'☽', c:'#dfe7ee' }, { k:'mercury', g:'☿', c:'#7ee4b8' },
  { k:'venus', g:'♀', c:'#f4a3c0' }, { k:'mars', g:'♂', c:'#e76f51' }, { k:'jupiter', g:'♃', c:'#f4a261' },
  { k:'saturn', g:'♄', c:'#a8b5c2' }, { k:'uranus', g:'♅', c:'#48cae4' }, { k:'neptune', g:'♆', c:'#457b9d' }
];
const ASPECTS = [
  { k:'conjonction', a:0,   orb:6, g:'☌', q:null },
  { k:'sextile',     a:60,  orb:4, g:'⚹', q:0.7 },
  { k:'carre',       a:90,  orb:5, g:'□', q:-0.9 },
  { k:'trigone',     a:120, orb:5, g:'△', q:1 },
  { k:'opposition',  a:180, orb:6, g:'☍', q:-0.7 }
];
const CONJ_Q = { sun:0.4, moon:0.4, mercury:0.4, venus:0.9, jupiter:0.9, mars:-0.4, saturn:-0.8 };
const T_WEIGHT = { sun:1, moon:0.8, mercury:0.9, venus:1, mars:1.1, jupiter:1.2, saturn:1.2 };
const TRANSITING = ['sun','moon','mercury','venus','mars','jupiter','saturn'];
const NATAL_PTS = TRANSITING;
const DOMAINS = { amour:['venus','moon','mars'], travail:['saturn','jupiter','mercury','sun'], energie:['mars','sun','moon'] };
const ACCENTS = ['#f4a261','#7ee4b8','#e76f51','#48cae4','#ffd166','#2a9d8f','#c3a6ff','#f4a3c0'];

// ---------- Langue ----------
const LANG_KEY = 'ciel-des-proches-lang';
let lang = (() => {
  try { const v = localStorage.getItem(LANG_KEY); if (v === 'fr' || v === 'en') return v; } catch (e) {}
  return (navigator.language || 'fr').toLowerCase().startsWith('fr') ? 'fr' : 'en';
})();
let L = T[lang], SIGNS, PLANETS, P;

function buildLangData() {
  L = T[lang];
  SIGNS = SIGN_DATA.map(([g, el], i) => ({ n: L.signs[i][0], art: L.signs[i][1], t: L.signs[i][2], g: g + '︎', el }));
  PLANETS = PLANET_DATA.map(p => { const [n, kw, ok, ko] = L.planets[p.k]; return { ...p, n, kw, ok, ko }; });
  P = Object.fromEntries(PLANETS.map(p => [p.k, p]));
}

const signOf = lon => SIGNS[Math.floor(norm(lon) / 30)];
const fmtDeg = lon => { const x = norm(lon) % 30; const d = Math.floor(x); const m = Math.floor((x - d) * 60); return `${d}°${String(m).padStart(2,'0')}′`; };
const houseOf = (lon, asc) => Math.floor(norm(lon - asc) / 30) + 1;
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const joinNames = a => a.length > 1 ? a.slice(0, -1).join(', ') + L.and + a.at(-1) : (a[0] || '');

// ---------- Stockage ----------
const STORE_KEY = 'ciel-des-proches-v1';
const DEMO = [{ id:'demo', name:'', date:'1985-07-14', time:'08:30',
  place:{ label:'Paris, Île-de-France, France', lat:48.8534, lon:2.3488, tz:'Europe/Paris' } }];
function loadPeople() {
  try { const v = JSON.parse(localStorage.getItem(STORE_KEY)); if (Array.isArray(v)) return v; } catch (e) {}
  return DEMO.map(d => ({ ...d }));
}
function savePeople() { try { localStorage.setItem(STORE_KEY, JSON.stringify(people)); } catch (e) {} }
const nameOf = p => p.id === 'demo' ? L.demoName : p.name;

let people = loadPeople();
let period = 0;
let selectedId = null;

// ---------- Calculs ----------
function natalChart(p) {
  const ms = localToUTC(p.date, p.time || '12:00', p.place.tz);
  const { lon } = skyAt(ms);
  const res = { ms, lon, timeKnown: !!p.time };
  if (p.time) Object.assign(res, angles(ms, p.place.lat, p.place.lon));
  const next = skyAt(ms + 86400000).lon;
  res.retro = {};
  for (const k of ['mercury','venus','mars','jupiter','saturn','uranus','neptune']) res.retro[k] = signedDiff(lon[k], next[k]) < 0;
  return res;
}

function findAspect(a, b) {
  const sep = angDiff(a, b);
  for (const asp of ASPECTS) { const delta = Math.abs(sep - asp.a); if (delta <= asp.orb) return { asp, delta }; }
  return null;
}

function dayForecast(natal, ms) {
  const tr = skyAt(ms).lon;
  const hits = [];
  for (const t of TRANSITING) for (const n of NATAL_PTS) {
    const f = findAspect(tr[t], natal.lon[n]);
    if (!f) continue;
    const q = f.asp.q === null ? CONJ_Q[t] : f.asp.q;
    const s = q * T_WEIGHT[t] * (1 - f.delta / f.asp.orb * 0.7);
    hits.push({ t, n, asp: f.asp, delta: f.delta, s });
  }
  const elT = SIGN_DATA[Math.floor(norm(tr.moon) / 30)][1], elN = SIGN_DATA[Math.floor(norm(natal.lon.moon) / 30)][1];
  const compat = { feu:'air', air:'feu', terre:'eau', eau:'terre' };
  const mood = elT === elN ? 0.5 : (compat[elT] === elN ? 0.3 : -0.2);
  const scores = {};
  for (const [k, pl] of Object.entries(DOMAINS)) {
    let sum = (k === 'amour' || k === 'energie') ? mood : 0;
    for (const h of hits) if (pl.includes(h.t) || pl.includes(h.n)) sum += h.s;
    scores[k] = Math.max(8, Math.min(96, Math.round(50 + 14 * sum)));
  }
  scores.global = Math.round((scores.amour + scores.travail + scores.energie) / 3);
  hits.sort((x, y) => Math.abs(y.s) - Math.abs(x.s));
  return { scores, hits };
}

function aspectSentence(h) {
  const Tp = P[h.t], N = P[h.n];
  if (h.asp.k === 'conjonction') return L.aspConj(Tp, N);
  const verb = L.aspVerb[h.asp.k];
  return h.s >= 0 ? L.aspGood(Tp, verb, N) : L.aspBad(Tp, verb, N);
}

function noonOf(offsetDays) {
  const now = new Date();
  return new Date(now.getFullYear(), now.getMonth(), now.getDate() + offsetDays, 12, 0).getTime();
}

function periodForecast(natal) {
  if (period !== 7) return { ...dayForecast(natal, noonOf(period)), days: null };
  const days = [];
  for (let i = 0; i < 7; i++) days.push({ ms: noonOf(i), f: dayForecast(natal, noonOf(i)) });
  const avg = k => Math.round(days.reduce((s, d) => s + d.f.scores[k], 0) / 7);
  const scores = { amour: avg('amour'), travail: avg('travail'), energie: avg('energie'), global: avg('global') };
  const best = days.reduce((a, b) => b.f.scores.global > a.f.scores.global ? b : a);
  const worst = days.reduce((a, b) => b.f.scores.global < a.f.scores.global ? b : a);
  return { scores, hits: best.f.hits, days, best, worst };
}

// ---------- Rendu ----------
const stars = v => { const n = Math.max(1, Math.min(5, Math.round(v / 20))); return '★'.repeat(n) + '<i>' + '★'.repeat(5 - n) + '</i>'; };
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const dayName = ms => new Date(ms).toLocaleDateString(L.locale, { weekday:'long', day:'numeric' });

function applyStatic() {

function renderSky() {
  const ms = noonOf(period === 7 ? 0 : period);
  const { lon } = skyAt(ms);
  const next = skyAt(ms + 86400000).lon;
  const elong = norm(lon.moon - lon.sun);
  const illum = Math.round((1 - cosd(elong)) / 2 * 100);
  const icons = ['🌑','🌒','🌓','🌔','🌕','🌖','🌗','🌘'];
  const ph = Math.floor(norm(elong + 22.5) / 45) % 8;
  const retro = ['mercury','venus','mars','jupiter','saturn','uranus','neptune'].filter(k => signedDiff(lon[k], next[k]) < 0);
  let tight = null;
  const ks = ['sun','moon','mercury','venus','mars','jupiter','saturn'];
  for (let i = 0; i < ks.length; i++) for (let j = i + 1; j < ks.length; j++) {
    const f = findAspect(lon[ks[i]], lon[ks[j]]);
    if (f && (!tight || f.delta < tight.delta)) tight = { ...f, a: ks[i], b: ks[j] };
  }
  const date = new Date(ms).toLocaleDateString(L.locale, { weekday:'long', day:'numeric', month:'long' });
  const orb = tight ? (lang === 'fr' ? tight.delta.toFixed(1).replace('.', ',') : tight.delta.toFixed(1)) : '';
  document.getElementById('sky').innerHTML = `
    <div class="bulletin-header">${L.skyHead} <span class="right">${period === 7 ? L.from : ''}${esc(date)}</span></div>
    <div class="bulletin-summary">${L.skySummary(signOf(lon.sun), signOf(lon.moon), retro.map(k => P[k].n))}</div>
    <div class="sky-row">
      <div class="sky-chip">${L.phaseLbl}<b>${icons[ph]} ${L.phases[ph]} · ${illum} %</b></div>
      <div class="sky-chip">${L.tightLbl}<b>${tight ? `${P[tight.a].g} ${P[tight.a].n} ${tight.asp.g} ${P[tight.b].n} ${P[tight.b].g}` : '—'}</b>${tight ? `${L.aspNames[tight.asp.k]}, ${L.orb} ${orb}°` : ''}</div>
      <div class="sky-chip">${L.retroLbl}<b>${retro.length ? retro.map(k => P[k].g + ' ' + P[k].n).join(' · ') : L.none}</b></div>
    </div>`;
}

function renderCards() {
  const names = people.map(nameOf);
  document.getElementById('subtitle').textContent = names.length
    ? L.subtitle(L.periodLbl[period], joinNames(names)) : L.subtitleEmpty;

  const rows = people.map((p, i) => { const natal = natalChart(p); return { p, i, natal, fc: periodForecast(natal) }; });
  const ranking = rows.slice().sort((a, b) => b.fc.scores.global - a.fc.scores.global);
  const medals = ['🥇','🥈','🥉'];

  document.getElementById('cards').innerHTML = rows.map(({ p, i, natal, fc }) => {
    const sun = signOf(natal.lon.sun), moon = signOf(natal.lon.moon);
    const asc = natal.timeKnown ? signOf(natal.asc) : null;
    const rank = rows.length > 1 ? ranking.findIndex(r => r.p.id === p.id) : -1;
    const lines = fc.hits.slice(0, 2).map(h => `<p>${aspectSentence(h)}</p>`).join('') || `<p class="muted">${L.calm}</p>`;
    const week = fc.days ? `<p class="muted">${L.best} : <b style="color:var(--text-hi)">${dayName(fc.best.ms)}</b> · ${L.worst} : ${dayName(fc.worst.ms)}</p>`.replace(/ : /g, lang === 'fr' ? ' : ' : ': ') : '';
    const birth = new Date(p.date).toLocaleDateString(L.locale, { timeZone: 'UTC' });
    return `<div class="card${p.id === selectedId ? ' selected' : ''}" style="--accent:${ACCENTS[i % ACCENTS.length]}" data-id="${esc(p.id)}" tabindex="0">
      ${rank >= 0 && rank < 3 ? `<span class="rank">${medals[rank]}</span>` : ''}
      <button class="card-del" data-del="${esc(p.id)}" title="${L.del}">✕</button>
      <div class="card-top"><div class="avatar">${sun.g}</div>
        <div><div class="card-names">${esc(nameOf(p))}</div><div class="card-city">${esc(p.place.label.split(',')[0])} · ${birth}</div></div></div>
      <div class="card-score" data-tip="${esc(L.tipGlobal)}" style="display:inline-block">${fc.scores.global}<span> /100</span></div>
      <div class="card-signs">☉ <b>${sun.n}</b> · ☽ <b>${moon.n}</b>${asc ? ` · AS <b>${asc.n}</b>` : ''}</div>
      <div class="horo">${Object.keys(DOMAINS).map(k => `<span class="horo-k">${L.domains[k]}</span><span class="stars" data-tip="${esc(L.tipScore(L.domains[k], fc.scores[k]))}">${stars(fc.scores[k])}</span>`).join('')}</div>
      <div class="card-text">${lines}${week}</div>
      <div class="card-foot">${L.see}</div>
    </div>`;
  }).join('');
  renderPalmares(rows, ranking, medals);
  document.getElementById('updated-at').textContent =
    L.computed + new Date().toLocaleString(L.locale, { day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' });
}

function planetTip(natal, pl) {
  const Lo = natal.lon[pl.k];
  return L.tipPlanet(pl, signOf(Lo), fmtDeg(Lo), natal.timeKnown ? houseOf(Lo, natal.asc) : 0, natal.retro[pl.k]);
}

function renderPalmares(rows, ranking, medals) {
  const box = document.getElementById('palmares');
  if (rows.length < 2) { box.classList.add('hidden'); box.innerHTML = ''; return; }
  const list = ranking.map((r, k) => {
    const sun = signOf(r.natal.lon.sun), v = r.fc.scores.global;
    return `<div class="pal-row${r.p.id === selectedId ? ' selected' : ''}" data-id="${esc(r.p.id)}" title="${esc(L.palTip)}">
      <span class="pal-rank">${k < 3 ? medals[k] : (k + 1) + '.'}</span>
      <span class="pal-name">${esc(nameOf(r.p))}<small>${sun.g} ${sun.n}</small></span>
      <span class="pal-bar"><i style="width:${v}%;background:${ACCENTS[r.i % ACCENTS.length]}"></i></span>
      <span class="pal-score">${v}</span>
    </div>`;
  }).join('');
  const champs = Object.keys(DOMAINS).map(k => {
    const best = rows.reduce((a, b) => b.fc.scores[k] > a.fc.scores[k] ? b : a);
    return `<div class="sky-chip">${L.domains[k]}<b>${esc(nameOf(best.p))} · ${best.fc.scores[k]}</b></div>`;
  }).join('');
  box.innerHTML = `
    <div class="bulletin-header">${L.palHead(L.periodLbl[period])} <span class="right">${L.palCount(rows.length)}</span></div>
    ${list}
    <div class="sub" style="margin-top:14px">${L.champions}</div>
    <div class="sky-row" style="margin-top:6px">${champs}</div>`;
  box.classList.remove('hidden');
}

function wheelSVG(natal) {
  const C = 170, R1 = 160, R2 = 132, R3 = 100;
  const asc = natal.timeKnown ? natal.asc : 0;
  const pt = (Lo, r) => { const t = (180 + Lo - asc) * RAD; return [C + r * Math.cos(t), C - r * Math.sin(t)]; };
  let s = `<svg class="wheel" viewBox="0 0 340 340" xmlns="http://www.w3.org/2000/svg" role="img">`;
  s += `<circle class="w-ring" cx="${C}" cy="${C}" r="${R1}"/><circle class="w-ring" cx="${C}" cy="${C}" r="${R2}"/><circle class="w-ring" cx="${C}" cy="${C}" r="${R3}"/>`;
  const elCol = { feu:'rgba(231,111,81,.10)', terre:'rgba(42,157,143,.10)', air:'rgba(255,209,102,.08)', eau:'rgba(69,123,157,.14)' };
  for (let i = 0; i < 12; i++) {
    const a = i * 30, [x1, y1] = pt(a, R1), [x2, y2] = pt(a + 30, R1), [x3, y3] = pt(a + 30, R2), [x4, y4] = pt(a, R2);
    s += `<path class="w-sector" data-tip="${esc(L.tipSign(SIGNS[i], L.elements[SIGNS[i].el]))}" fill="${elCol[SIGNS[i].el]}" d="M${x1},${y1} A${R1},${R1} 0 0 0 ${x2},${y2} L${x3},${y3} A${R2},${R2} 0 0 1 ${x4},${y4} Z"/>`;
    const [gx, gy] = pt(a + 15, (R1 + R2) / 2);
    s += `<text class="w-sign" style="pointer-events:none" x="${gx}" y="${gy}">${SIGNS[i].g}</text>`;
  }
  if (natal.timeKnown) {
    for (let h = 0; h < 12; h++) {
      const [x1, y1] = pt(asc + h * 30, R2), [x2, y2] = pt(asc + h * 30, 22);
      s += `<line class="w-hl" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>`;
      const [hx, hy] = pt(asc + h * 30 + 15, 30);
      s += `<g data-tip="${esc(L.tipHouse(h + 1))}"><circle class="w-hit" cx="${hx}" cy="${hy}" r="7"/><text class="w-house" x="${hx}" y="${hy}">${h + 1}</text></g>`;
    }
    const [ax1, ay1] = pt(asc, R1 + 2), [ax2, ay2] = pt(asc + 180, R1 + 2);
    const tipA = esc(L.tipAsc(signOf(asc), fmtDeg(asc))), tipM = esc(L.tipMc(signOf(natal.mc), fmtDeg(natal.mc)));
    s += `<g data-tip="${tipA}"><line class="w-axis" x1="${ax1}" y1="${ay1}" x2="${ax2}" y2="${ay2}"/><line class="w-hitline" x1="${ax1}" y1="${ay1}" x2="${ax2}" y2="${ay2}"/></g>`;
    const [mx1, my1] = pt(natal.mc, R1 + 2), [mx2, my2] = pt(natal.mc + 180, R1 + 2);
    s += `<g data-tip="${tipM}"><line class="w-axis" style="stroke-dasharray:4 3" x1="${mx1}" y1="${my1}" x2="${mx2}" y2="${my2}"/><line class="w-hitline" x1="${mx1}" y1="${my1}" x2="${mx2}" y2="${my2}"/></g>`;
    s += `<text class="w-lbl" data-tip="${tipA}" x="${ax1 + 2}" y="${ay1 - 4}">AS</text>`;
    const [lx, ly] = pt(natal.mc, R1 + 2);
    s += `<text class="w-lbl" data-tip="${tipM}" x="${lx + 3}" y="${ly + 10}">MC</text>`;
  }
  for (let i = 0; i < PLANETS.length; i++) for (let j = i + 1; j < PLANETS.length; j++) {
    const a = natal.lon[PLANETS[i].k], b = natal.lon[PLANETS[j].k], f = findAspect(a, b);
    if (!f || f.asp.k === 'conjonction') continue;
    const col = f.asp.q > 0 ? '#7ee4b8' : '#e76f51';
    const [x1, y1] = pt(a, R3 - 2), [x2, y2] = pt(b, R3 - 2);
    const A = PLANETS[i], B = PLANETS[j];
    const orb = lang === 'fr' ? f.delta.toFixed(1).replace('.', ',') : f.delta.toFixed(1);
    const tip = esc(`<b>${A.g} ${A.n} ${f.asp.g} ${B.n} ${B.g}</b> <span class="tip-lo">· ${L.aspNames[f.asp.k]}, ${L.orb} ${orb}°</span><br>${L.tipAsp[f.asp.k]}`);
    s += `<g data-tip="${tip}"><line class="w-asp" stroke="${col}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/><line class="w-hitline" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/></g>`;
  }
  const placed = PLANETS.map(p => ({ p, Lo: natal.lon[p.k], r: (R2 + R3) / 2 })).sort((a, b) => a.Lo - b.Lo);
  for (let i = 0; i < placed.length; i++) {
    const prev = placed[i - 1];
    if (prev && angDiff(prev.Lo, placed[i].Lo) < 8 && prev.r === placed[i].r) placed[i].r = placed[i].r - 18 < R3 - 8 ? (R2 + R3) / 2 : placed[i].r - 18;
  }
  for (const { p, Lo, r } of placed) {
    const [tx1, ty1] = pt(Lo, R2), [tx2, ty2] = pt(Lo, R2 - 5);
    s += `<line class="w-tick" stroke="${p.c}" x1="${tx1}" y1="${ty1}" x2="${tx2}" y2="${ty2}"/>`;
    const [x, y] = pt(Lo, r - 4);
    s += `<g data-tip="${esc(planetTip(natal, p))}"><circle class="w-hit" cx="${x}" cy="${y}" r="11"/><text class="w-pl" fill="${p.c}" x="${x}" y="${y}">${p.g}</text></g>`;
  }
  return s + '</svg>';
}

function renderTheme() {
  const box = document.getElementById('theme');
  const p = people.find(x => x.id === selectedId);
  if (!p) { box.classList.add('hidden'); return; }
  const natal = natalChart(p);
  const rowsHTML = PLANETS.map(pl => {
    const Lo = natal.lon[pl.k], sg = signOf(Lo);
    return `<tr data-tip="${esc(planetTip(natal, pl))}"><td class="k"><span style="color:${pl.c}">${pl.g}</span> ${pl.n}${natal.retro[pl.k] ? ` <span title="${L.retroTitle}">℞</span>` : ''}</td>
      <td>${sg.g} ${sg.n}</td><td class="deg">${fmtDeg(Lo)}${natal.timeKnown ? ` · ${L.houseAbbr}${houseOf(Lo, natal.asc)}` : ''}</td></tr>`;
  }).join('') + (natal.timeKnown ? `
      <tr data-tip="${esc(L.tipAsc(signOf(natal.asc), fmtDeg(natal.asc)))}"><td class="k">AS ${L.ascLbl}</td><td>${signOf(natal.asc).g} ${signOf(natal.asc).n}</td><td class="deg">${fmtDeg(natal.asc)}</td></tr>
      <tr data-tip="${esc(L.tipMc(signOf(natal.mc), fmtDeg(natal.mc)))}"><td class="k">MC ${L.mcLbl}</td><td>${signOf(natal.mc).g} ${signOf(natal.mc).n}</td><td class="deg">${fmtDeg(natal.mc)}</td></tr>` : '');

  const sun = signOf(natal.lon.sun), moon = signOf(natal.lon.moon);
  let interp = `<p><b>☉ ${L.inSign(P.sun.n, sun.n)}</b> — ${L.iSun(sun, P.sun.kw)}</p>
    <p><b>☽ ${L.inSign(P.moon.n, moon.n)}</b> — ${L.iMoon(moon, P.moon.kw, natal.timeKnown)}</p>`;
  if (natal.timeKnown) {
    const as = signOf(natal.asc);
    interp += `<p><b>AS ${L.ascIn(as.n)}</b> — ${L.iAsc(as)}</p>`;
  }
  const others = ['mercury','venus','mars','jupiter','saturn'].map(k => {
    const pl = P[k], sg = signOf(natal.lon[k]);
    const house = natal.timeKnown ? L.houses[houseOf(natal.lon[k], natal.asc) - 1] : '';
    return `<p><b>${pl.g} ${L.inSign(pl.n, sg.n)}</b> — ${L.iPlanet(sg, pl.kw, house)}</p>`;
  }).join('');

  const elems = { feu:0, terre:0, air:0, eau:0 };
  ['sun','moon','mercury','venus','mars','jupiter','saturn'].forEach(k => elems[signOf(natal.lon[k]).el]++);
  const domEl = Object.entries(elems).sort((a, b) => b[1] - a[1])[0][0];
  const counts = Object.entries(elems).map(([k, v]) => `${v} ${L.elements[k]}`).join(' · ');

  const birth = new Date(natal.ms).toLocaleString(L.locale, { timeZone: p.place.tz, dateStyle:'long', timeStyle: p.time ? 'short' : undefined });
  box.innerHTML = `
    <div class="bulletin-header">${L.themeHead(esc(nameOf(p)))} <span class="right">${esc(birth)}${p.time ? '' : ' · ' + L.unknownTime} · ${esc(p.place.label)}</span></div>
    <div class="theme-grid">
      <div>${wheelSVG(natal)}</div>
      <div><table class="pos">${rowsHTML}</table></div>
    </div>
    <div class="interp">
      <div class="sub">${L.bigLines}</div>
      ${interp}
      <p>${L.domEl(L.elements[domEl], counts, L.elText[domEl])}</p>
      <div class="sub">${L.planetsLines}</div>
      ${others}
    </div>`;
  box.classList.remove('hidden');
}

function renderAll() { buildLangData(); applyStatic(); renderSky(); renderCards(); renderTheme(); }

// ---------- Interactions ----------
document.getElementById('lang-switch').addEventListener('click', e => {
  const b = e.target.closest('button[data-lang]'); if (!b || b.dataset.lang === lang) return;
  lang = b.dataset.lang;
  try { localStorage.setItem(LANG_KEY, lang); } catch (err) {}
  fMsg.textContent = '';
  renderAll();
});

document.getElementById('day-toggle').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  period = +b.dataset.p;
  document.querySelectorAll('.day-toggle-btn').forEach(x => x.classList.toggle('active', x === b));
  renderSky(); renderCards();
});

document.getElementById('palmares').addEventListener('click', e => {
  const row = e.target.closest('.pal-row'); if (!row) return;
  selectedId = row.dataset.id;
  renderCards(); renderTheme();
  document.getElementById('theme').scrollIntoView({ behavior:'smooth', block:'start' });
});

document.getElementById('cards').addEventListener('click', e => {
  const del = e.target.closest('[data-del]');
  if (del) {
    e.stopPropagation();
    const p = people.find(x => x.id === del.dataset.del);
    if (p && confirm(L.confirmDel(nameOf(p)))) {
      people = people.filter(x => x.id !== p.id);
      if (selectedId === p.id) selectedId = null;
      savePeople(); renderAll();
    }
    return;
  }
  const card = e.target.closest('.card'); if (!card) return;
  selectedId = selectedId === card.dataset.id ? null : card.dataset.id;
  renderCards(); renderTheme();
  if (selectedId) document.getElementById('theme').scrollIntoView({ behavior:'smooth', block:'start' });
});
document.getElementById('cards').addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.classList.contains('card')) e.target.click();
});

document.getElementById('share-btn').addEventListener('click', async () => {
  const data = { title: document.title, text: L.shareText, url: location.href };
  try {
    if (navigator.share) await navigator.share(data);
    else { await navigator.clipboard.writeText(location.href); alert(L.copied); }
  } catch (e) {}
});

// Formulaire
const formBlock = document.getElementById('form-block');
const fName = document.getElementById('f-name'), fDate = document.getElementById('f-date'),
      fTime = document.getElementById('f-time'), fNoTime = document.getElementById('f-notime'),
      fPlace = document.getElementById('f-place'), suggest = document.getElementById('suggest'), fMsg = document.getElementById('f-msg');
let chosenPlace = null, geoTimer = null;

document.getElementById('add-btn').addEventListener('click', () => {
  formBlock.classList.toggle('hidden');
  if (!formBlock.classList.contains('hidden')) fName.focus();
});
document.getElementById('f-cancel').addEventListener('click', () => formBlock.classList.add('hidden'));
fNoTime.addEventListener('change', () => { fTime.disabled = fNoTime.checked; });

// Saisie au clavier : 14071985 → 14/07/1985, 0830 → 08:30
function autoFormat(input, groups, sep) {
  input.addEventListener('input', e => {
    if (e.inputType && e.inputType.startsWith('delete')) return;
    const d = input.value.replace(/\D/g, '');
    let out = '', i = 0;
    for (let g = 0; g < groups.length && i < d.length; g++) {
      const part = d.slice(i, i + groups[g]);
      out += part; i += part.length;
      if (part.length === groups[g] && g < groups.length - 1) out += sep;
    }
    input.value = out;
  });
}
autoFormat(fDate, [2, 2, 4], '/');
autoFormat(fTime, [2, 2], ':');

function parseDate(str) {
  const m = str.trim().match(/^(\d{1,2})\D+(\d{1,2})\D+(\d{4})$/) || str.replace(/\D/g, '').match(/^(\d{2})(\d{2})(\d{4})$/);
  if (!m) return null;
  const d = +m[1], mo = +m[2], y = +m[3];
  if (y < 1900 || y > 2100) return null;
  const t = new Date(Date.UTC(y, mo - 1, d));
  if (t.getUTCFullYear() !== y || t.getUTCMonth() !== mo - 1 || t.getUTCDate() !== d) return null;
  return `${y}-${String(mo).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
}
function parseTime(str) {
  let h, mi;
  const m = str.trim().match(/^(\d{1,2})\s*[:h.]\s*(\d{0,2})$/i);
  if (m) { h = +m[1]; mi = m[2] ? +m[2] : 0; }
  else {
    const d = str.replace(/\D/g, '');
    if (d.length < 1 || d.length > 4) return null;
    if (d.length <= 2) { h = +d; mi = 0; } else { h = +d.slice(0, d.length - 2); mi = +d.slice(-2); }
  }
  if (h > 23 || mi > 59) return null;
  return `${String(h).padStart(2, '0')}:${String(mi).padStart(2, '0')}`;
}

fPlace.addEventListener('input', () => {
  chosenPlace = null;
  clearTimeout(geoTimer);
  const q = fPlace.value.trim();
  if (q.length < 2) { suggest.classList.add('hidden'); return; }
  geoTimer = setTimeout(async () => {
    try {
      const r = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=6&language=${lang}&format=json`);
      const j = await r.json();
      const res = (j.results || []).filter(x => x.timezone);
      suggest.innerHTML = res.length ? res.map((x, i) => `<button type="button" data-i="${i}">${esc(x.name)}
          <small>${esc([x.admin1, x.country].filter(Boolean).join(', '))}</small></button>`).join('')
        : `<button type="button" disabled><small>${L.noPlace}</small></button>`;
      suggest.classList.remove('hidden');
      suggest.onclick = e => {
        const b = e.target.closest('button[data-i]'); if (!b) return;
        const x = res[+b.dataset.i];
        chosenPlace = { label: [x.name, x.admin1, x.country].filter(Boolean).join(', '), lat: x.latitude, lon: x.longitude, tz: x.timezone };
        fPlace.value = chosenPlace.label;
        suggest.classList.add('hidden');
      };
    } catch (e) {
      suggest.innerHTML = `<button type="button" disabled><small>${L.offline}</small></button>`;
      suggest.classList.remove('hidden');
    }
  }, 300);
});
document.addEventListener('click', e => { if (!e.target.closest('.place-field')) suggest.classList.add('hidden'); });

document.getElementById('f-save').addEventListener('click', () => {
  const err = m => { fMsg.textContent = m; fMsg.className = 'form-msg err'; };
  const name = fName.value.trim();
  if (!name) return err(L.errName);
  const iso = parseDate(fDate.value);
  if (!iso) return err(L.errDate);
  let hhmm = null;
  if (!fNoTime.checked) {
    if (!fTime.value.trim()) return err(L.errTime);
    hhmm = parseTime(fTime.value);
    if (!hhmm) return err(L.errTimeBad);
  }
  if (!chosenPlace) return err(L.errPlace);
  const p = { id: 'p' + Date.now().toString(36), name, date: iso, time: hhmm, place: chosenPlace };
  people = people.filter(x => x.id !== 'demo');
  people.push(p);
  savePeople();
  selectedId = p.id;
  fName.value = ''; fDate.value = ''; fTime.value = ''; fPlace.value = ''; chosenPlace = null; fMsg.textContent = '';
  formBlock.classList.add('hidden');
  renderAll();
  document.getElementById('theme').scrollIntoView({ behavior:'smooth', block:'start' });
});

// Info-bulles
const tipEl = document.createElement('div');
tipEl.className = 'js-tooltip hidden';
document.body.appendChild(tipEl);
function placeTip(x, y) {
  const w = tipEl.offsetWidth, h = tipEl.offsetHeight;
  let left = x + 14, top = y + 16;
  if (left + w > innerWidth - 8) left = Math.max(8, x - w - 14);
  if (top + h > innerHeight - 8) top = Math.max(8, y - h - 14);
  tipEl.style.left = left + 'px'; tipEl.style.top = top + 'px';
}
document.addEventListener('pointerover', e => {
  const t = e.target.closest && e.target.closest('[data-tip]');
  if (!t) return;
  tipEl.innerHTML = t.dataset.tip;
  tipEl.classList.remove('hidden');
  placeTip(e.clientX, e.clientY);
});
document.addEventListener('pointermove', e => { if (!tipEl.classList.contains('hidden')) placeTip(e.clientX, e.clientY); });
document.addEventListener('pointerout', e => {
  const to = e.relatedTarget;
  if (!to || !to.closest || !to.closest('[data-tip]')) tipEl.classList.add('hidden');
});
addEventListener('scroll', () => tipEl.classList.add('hidden'), { passive: true });

renderAll();
</script>
